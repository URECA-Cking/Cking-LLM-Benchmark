name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  # 배포 패키지에 들어가는 파일과 패키지 확인·배포 스크립트, 이 워크플로가 바뀔 때만 배포한다. develop은 개발, main은 운영이다.
  push:
    branches: [develop, main]
    paths:
      - "src/**"
      - "data/**"
      - "deploy/**"
      - "requirements-deploy.txt"
      - "scripts/build-package.sh"
      - "scripts/check-package.sh"
      - "scripts/deploy/**"
      - ".github/workflows/ci.yml"
  # 매월 1일 10:00(KST)에 Python 3.12 최신 패치로 다시 빌드해 개발에 배포한다. 03:00 일일 작업과 겹치지 않게 한다.
  # 라이브러리 패치는 고정 버전이라 다시 빌드해도 바뀌지 않으므로 Dependabot PR로 받는다.
  schedule:
    - cron: "0 1 1 * *"
  # develop에서는 개발 재빌드·배포, main에서는 운영 배포. 운영 되돌리기는 main에서 예전 버전 ID를 넣는다.
  workflow_dispatch:
    inputs:
      release:
        description: 운영 되돌리기용 운영 배포 버킷의 버전 ID(<빌드 시각>-<커밋 12자리>). 일반 실행은 비워 둔다
        type: string
        required: false

# develop·main 실행은 브랜치마다 하나씩 돌린다. 대기 중인 실행은 새 실행이 오면 취소되고 새 실행이 대신한다. PR은 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::551372961758:role/dev-cking-recommendation-github-actions-role
  RELEASE_PREFIX: s3://dev-cking-deploy-551372961758/recommendation/releases
  RELEASE_PARAMETER: /cking/dev-recommendation/RELEASE
  ASG_NAME: dev-cking-recommendation
  PROD_ROLE_ARN: arn:aws:iam::551372961758:role/prod-cking-recommendation-github-actions-role
  PROD_RELEASE_PREFIX: s3://prod-cking-deploy-551372961758-ap-northeast-2-an/recommendation/releases
  PROD_RELEASE_PARAMETER: /cking/prod-recommendation/RELEASE
  PROD_ASG_NAME: prod-cking-recommendation
  TORCH_VERSION: "2.14.1+cpu"

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # 실험 코드 테스트에 sentence-transformers가 필요하다. 기본 PyPI의 linux/arm64 torch는 CUDA 패키지를 함께 받아 CPU 빌드를 먼저 설치한다.
      - name: 의존성 설치
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"
          python -m pip install -r requirements-test.txt
      - name: 테스트
        run: python -m pytest -q
      - name: 워크플로 검사
        run: >
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -no-color
      # 배포 단계 셸은 scripts/deploy로 옮겨 actionlint가 검사하지 않으므로 같은 이미지의 shellcheck로 검사한다.
      - name: 배포 스크립트 검사
        run: >
          docker run --rm -v "$PWD:/repo:ro" -w /repo --entrypoint shellcheck
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          scripts/deploy/*.sh

  # 배포 역할은 develop에서만 맡을 수 있어 PR에서는 패키지를 만들지 않는다.
  deploy-dev:
    name: Deploy to dev
    needs: test
    # 저장소 변수 DEPLOY_ENABLED가 true일 때만 배포한다. 배포할 서버가 없을 때는 변수를 지워 검사만 돌린다.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      # 배포된 커밋이 이 커밋의 조상인지 보려면 이력이 모두 있어야 한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"

      # 실행마다 새 패키지를 만든다. 같은 커밋을 다시 실행해도 이번에 확인한 패키지를 배포한다.
      - name: 패키지 빌드
        id: build
        run: |
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::12}"
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/cking-llm
          scripts/build-package.sh "$RELEASE" "$RUNNER_TEMP/package"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: 패키지 확인
        run: |
          scripts/check-package.sh "$RUNNER_TEMP/package/cking-llm.tar.gz" | tee "$RUNNER_TEMP/check.log"
          sed -n 's/^configHash=/생성 설정 해시(taxonomy 승인 등록용): /p' "$RUNNER_TEMP/check.log" >> "$GITHUB_STEP_SUMMARY"

      - name: 패키지 업로드
        env:
          RELEASE: ${{ steps.build.outputs.release }}
        run: |
          for f in cking-llm.tar.gz cking-llm.tar.gz.sha256; do
            aws s3 cp "$RUNNER_TEMP/package/$f" "$RELEASE_PREFIX/$RELEASE/$f" --only-show-errors
          done
          echo "패키지: $RELEASE_PREFIX/$RELEASE/" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 배포 버전 갱신
        id: release
        env:
          RELEASE: ${{ steps.build.outputs.release }}
        run: scripts/deploy/update-dev-release.sh

      - name: 개발 추천 배치 서버 교체
        if: steps.release.outputs.updated == 'true'
        env:
          RELEASE: ${{ steps.build.outputs.release }}
        run: scripts/deploy/refresh-dev-servers.sh

  # 운영은 새로 빌드하지 않고 개발 CI가 확인하고 올린 패키지를 운영 배포 버킷에 복사한다. 역할은 main에서만 맡을 수 있다.
  deploy-prod:
    name: Deploy to prod
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    # 이전 교체 대기(최대 20분)와 새 교체(최대 20분)가 이어질 수 있다.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 올릴 패키지 정하기
        id: pick
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: scripts/deploy/pick-prod-release.sh

      - name: 운영 배포 버킷에 복사
        if: steps.pick.outputs.rollback != 'true'
        env:
          RELEASE: ${{ steps.pick.outputs.release }}
        run: scripts/deploy/copy-prod-release.sh

      - name: 배포 버전 갱신
        id: release
        env:
          RELEASE: ${{ steps.pick.outputs.release }}
          ROLLBACK: ${{ steps.pick.outputs.rollback }}
        run: scripts/deploy/update-prod-release.sh

      - name: 운영 추천 배치 서버 교체
        if: steps.release.outputs.updated == 'true'
        run: scripts/deploy/refresh-prod-servers.sh
